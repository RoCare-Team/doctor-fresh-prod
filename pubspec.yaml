name: doctor_fresh
description: Doctor Fresh — water purifiers, purifier care and service reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# No third-party packages: networking (dart:io HttpClient), storage (a JSON
# file in the app's own folder), HTML rendering and the native bridge
# (lib/core/native.dart + MainActivity.kt / AppDelegate.swift) are all
# written with the Flutter SDK alone.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
